[project]
name = "claude-export-viewer"
version = "2026.10.26.16"
description = "Local, cumulative archive of Claude.ai data exports, browsable offline as a static HTML site"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Judson Neer" },
    { name = "fordom" },
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "mistune>=3.0",
    "pydantic>=2.0",
    "pygments>=2.17",
]

[project.urls]
"Original project" = "https://github.com/lordjabez/claude-export-viewer"

[project.scripts]
claude-export-viewer = "claude_export_viewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_export_viewer"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
